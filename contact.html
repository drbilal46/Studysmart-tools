<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Contact Us | StudySmart Tools</title>

<style>
body{
font-family:Arial,sans-serif;
background:#f5f7fb;
color:#172033;
line-height:1.7;
margin:0;
}

header{
background:#fff;
padding:18px 20px;
box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.logo{
font-size:22px;
font-weight:bold;
}

.logo span{
color:#2563eb;
}

.container{
max-width:700px;
margin:40px auto;
padding:20px;
}

.box{
background:#fff;
padding:30px;
border-radius:15px;
box-shadow:0 4px 18px rgba(0,0,0,.07);
}

h1{
color:#2563eb;
}

input,textarea{
width:100%;
padding:12px;
margin:8px 0;
border:1px solid #d5dbe5;
border-radius:8px;
font-size:15px;
box-sizing:border-box;
}

textarea{
height:140px;
resize:vertical;
}

button{
width:100%;
padding:12px;
border:0;
border-radius:8px;
background:#2563eb;
color:white;
font-size:15px;
cursor:pointer;
margin-top:8px;
}

a{
color:#2563eb;
text-decoration:none;
}

footer{
text-align:center;
padding:25px;
margin-top:40px;
background:#fff;
color:#687386;
}
</style>
</head>

<body>

<header>

<div class="logo">
Study<span>Smart</span> Tools
</div>

</header>

<div class="container">

<div class="box">

<h1>Contact Us</h1>

<p>
Have a question, suggestion or feedback?
We would love to hear from you.
</p>

<form onsubmit="sendMessage(event)">

<input
type="text"
id="name"
placeholder="Your Name"
required
>

<input
type="email"
id="email"
placeholder="Your Email"
required
>

<textarea
id="message"
placeholder="Write your message..."
required
></textarea>

<button type="submit">
Send Message
</button>

</form>

<p id="result"></p>

<br>

<a href="index.html">← Back to StudySmart Tools</a>

</div>

</div>

<footer>

© 2026 StudySmart Tools

</footer>

<script>

function sendMessage(event){

event.preventDefault();

document.getElementById("result").innerText =
"Thank you! Your message has been received.";

}

</script>

</body>
</html>
