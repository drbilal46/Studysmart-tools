<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="robots" content="noindex">

    <title>Page Not Found - StudySmart Tools</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #172033;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .error-box {
            width: 100%;
            max-width: 600px;
            background: #fff;
            padding: 40px 25px;
            border-radius: 18px;
            text-align: center;
            box-shadow: 0 4px 20px #00000012;
        }

        .error-code {
            font-size: 80px;
            font-weight: 700;
            color: #2563eb;
            margin: 0;
        }

        h1 {
            margin: 5px 0 12px;
            font-size: 28px;
        }

        p {
            color: #687386;
            font-size: 16px;
            margin-bottom: 25px;
        }

        .home-btn {
            display: inline-block;
            padding: 12px 22px;
            background: #2563eb;
            color: #fff;
            text-decoration: none;
            border-radius: 8px;
            font-size: 15px;
        }

        .home-btn:hover {
            opacity: 0.9;
        }
    </style>
</head>

<body>

    <div class="error-box">

        <div class="error-code">404</div>

        <h1>Page Not Found</h1>

        <p>
            Sorry, the page you are looking for does not exist.
            Please return to StudySmart Tools.
        </p>

        <a class="home-btn" href="/Studysmart-tools/">
            Go to Home
        </a>

    </div>

</body>
  </html>
